<!DOCTYPE html>

<html lang="fr">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Jeu aléatoire - Ma Ludothèque</title>

<link
    rel="stylesheet"
    href="random.css"
>


</head>

<body>

<!-- ==========================================
     HEADER
========================================== -->

<header class="header">


<div class="header-content">

    <a
        href="index.html"
        class="logo"
    >

        <span class="logo-icon">🎲</span>

        <div>

            <h1>Ma Ludothèque</h1>

            <p>Jeu aléatoire</p>

        </div>

    </a>


    <a
        href="index.html"
        class="back-button"
    >
        ← Retour à la ludothèque
    </a>

</div>


</header>

<!-- ==========================================
     CONTENU
========================================== -->

<main class="container">


<section class="page-title">

    <h2>
        Quel jeu jouer ?
    </h2>

    <p>
        Laisse le hasard choisir pour toi.
    </p>

</section>



<!-- ======================================
     FILTRES
======================================= -->

<section class="random-card">

    <div class="card-header">

        <div>

            <h3>
                🎯 Tes critères
            </h3>

            <p>
                Les critères sont facultatifs.
            </p>

        </div>

    </div>



    <div class="filters">


        <!-- JOUEURS -->

        <div class="filter-group">

            <label for="players">

                👥 Nombre de joueurs

            </label>

            <select id="players">

                <option value="">
                    Peu importe
                </option>

                <option value="1">1 joueur</option>
                <option value="2">2 joueurs</option>
                <option value="3">3 joueurs</option>
                <option value="4">4 joueurs</option>
                <option value="5">5 joueurs</option>
                <option value="6">6 joueurs</option>
                <option value="7">7 joueurs</option>
                <option value="8">8 joueurs</option>
                <option value="9">9 joueurs</option>
                <option value="10">10 joueurs</option>

            </select>

        </div>



        <!-- DUREE MINIMUM -->

        <div class="filter-group">

            <label for="minTime">

                ⏱️ Durée minimum

            </label>

            <div class="input-unit">

                <input
                    type="number"
                    id="minTime"
                    min="1"
                    placeholder="Peu importe"
                >

                <span>min</span>

            </div>

        </div>



        <!-- DUREE MAXIMUM -->

        <div class="filter-group">

            <label for="maxTime">

                ⏱️ Durée maximum

            </label>

            <div class="input-unit">

                <input
                    type="number"
                    id="maxTime"
                    min="1"
                    placeholder="Peu importe"
                >

                <span>min</span>

            </div>

        </div>


    </div>



    <button
        id="randomButton"
        class="random-button"
        type="button"
    >

        🎲
        <span>Lancer le tirage</span>

    </button>


</section>



<!-- ======================================
     RESULTAT
======================================= -->

<section
    id="resultSection"
    class="result-section"
>


    <div class="result-card">


        <div
            id="resultImage"
            class="result-image"
        >

            🎲

        </div>



        <div class="result-info">

            <span class="result-label">
                TON JEU
            </span>


            <h3 id="resultName">
                Prêt pour le tirage ?
            </h3>


            <p
                id="resultFranchise"
                class="result-franchise"
            ></p>


            <div
                id="resultDetails"
                class="result-details"
            ></div>


            <p
                id="resultDescription"
                class="result-description"
            ></p>

        </div>


    </div>


    <button
        id="rerollButton"
        class="reroll-button"
        type="button"
    >

        🎲 Relancer

    </button>


</section>



<!-- ======================================
     MESSAGE
======================================= -->

<section
    id="messageSection"
    class="message-section"
>

    <div class="message-icon">
        🔎
    </div>

    <h3 id="messageTitle">
        Aucun jeu trouvé
    </h3>

    <p id="messageText">
        Aucun jeu ne correspond à tes critères.
    </p>

</section>


</main>

<!-- ==========================================
     FOOTER
========================================== -->

<footer class="footer">


Ma Ludothèque


</footer>

<script
    type="module"
    src="random.js"
></script>

</body>

</html>
